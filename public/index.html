<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Минутка — поминутная аренда</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0c0f14; --panel:#151a23; --panel2:#1b212d; --line:#262e3d;
  --text:#eef1f6; --muted:#9aa3b2;
  --green:#22c55e; --green-d:#15803d; --amber:#f59e0b; --red:#ef4444; --blue:#60a5fa;
  --r:16px;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:500;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:rgba(13,16,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:.2px}
.brand .logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--green),#4ade80);display:flex;align-items:center;justify-content:center;color:#06270f;font-weight:900;font-size:16px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
#user{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 12px;border-radius:999px;white-space:nowrap}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 40px}
.map-card{border-radius:var(--r);overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.35)}
#map{height:38vh;min-height:260px;background:#111}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:20px 2px 4px}
.sect h3{margin:0;font-size:16px}
.pill{font-size:12px;font-weight:700;background:rgba(34,197,94,.12);color:#4ade80;border:1px solid rgba(34,197,94,.35);padding:5px 12px;border-radius:999px;white-space:nowrap}
.balance-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.balance{font-size:15px;color:var(--muted)}
.balance b{font-size:26px;color:var(--text);margin:0 2px}
button{background:linear-gradient(180deg,#2bd465,#1da34e);border:0;color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;margin:6px 6px 0 0;font-size:14px;transition:transform .06s,filter .15s}
button:hover{filter:brightness(1.08)} button:active{transform:scale(.97)}
button.ghost{background:var(--panel2);border:1px solid var(--line)}
button.danger{background:linear-gradient(180deg,#f0564f,#c92f2f)}
button:disabled{opacity:.5;cursor:default}
input{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#0f141c;color:var(--text);margin:4px 0;width:100%;font-size:14px}
input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
.row{display:flex;gap:8px} .row>div{flex:1}
small{color:var(--muted)} a{color:var(--blue);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.car-card{display:flex;flex-direction:column;gap:8px}
.car-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.car-top b{font-size:15px}
.plate{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#0f141c;border:1px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--muted);white-space:nowrap}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;background:#555}
.dot.free{background:var(--green);box-shadow:0 0 8px rgba(34,197,94,.8)}
.dot.hold,.dot.rent{background:var(--amber);box-shadow:0 0 8px rgba(245,158,11,.8)}
.dot.service{background:var(--red)}
.fuel{height:6px;border-radius:99px;background:#0f141c;overflow:hidden}
.fuel i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),#a3e635)}
.meta{font-size:12px;color:var(--muted)}
.tariff{font-size:13px;font-weight:700;color:#4ade80}
.car-card button{margin:4px 0 0;width:100%}
#active:empty{display:none}
#active{margin-top:12px;background:var(--panel2);border:1px solid rgba(34,197,94,.35);border-radius:12px;padding:12px}
#active .st{font-size:13px;font-weight:800;background:rgba(34,197,94,.15);color:#4ade80;padding:4px 12px;border-radius:999px}
.hist-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:10px 2px;border-bottom:1px solid var(--line)}
.hist-row:last-child{border-bottom:0}
.hist-row .sum{font-weight:800;white-space:nowrap}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
@media(max-width:560px){ .wrap{padding:10px 10px 32px} #map{height:34vh} }
[data-theme="light"]{--bg:#eef1f6;--panel:#ffffff;--panel2:#e7ecf3;--line:#d5dce7;--text:#141a24;--muted:#5b6572}
[data-theme="light"] header{background:rgba(255,255,255,.92)}
[data-theme="light"] input{background:#fff}
[data-theme="light"] .plate{background:#eef1f6}
[data-theme="light"] .fuel{background:#dde3ec}
[data-theme="light"] .pill{color:#15803d;border-color:rgba(21,128,61,.4);background:rgba(34,197,94,.1)}
[data-theme="light"] .tariff{color:#15803d}
[data-theme="light"] #active{border-color:rgba(21,128,61,.4)}
[data-theme="light"] #active .st{color:#15803d;background:rgba(34,197,94,.12)}
.theme-btn{padding:7px 14px;font-size:12px;margin:0}
.head-right{display:flex;gap:8px;align-items:center}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="logo">M</span><span>Минутка<small>Сургут · поминутно</small></span></div>
  <div class="head-right"><span id="user">—</span><button class="ghost theme-btn" onclick="logout()">Выйти</button><button class="ghost theme-btn" id="themeBtn" onclick="cycleTheme()">Тема</button></div>
</header>
<div class="wrap">
  <div class="map-card"><div id="map"></div></div>

  <div class="card" id="auth">
    <h3>Вход / Регистрация</h3>
    <div class="row"><div><input id="phone" placeholder="+79990001122" value="+79990001122"></div>
    <div><input id="pass" type="password" placeholder="пароль" value="demo123"></div></div>
    <button onclick="login()">Войти</button>
    <button class="ghost" onclick="register()">Регистрация (+500₽ бонус)</button>
    <div style="margin-top:8px"><small>демо: +79990001122/demo123 · <a href="/admin.html">админка</a></small></div>
  </div>

  <div class="card">
    <div class="balance-row">
      <span class="balance">Баланс: <b id="balance">—</b> ₽</span>
      <button class="ghost" onclick="topup()">+500 ₽ (mock)</button>
    </div>
    <div id="active"></div>
  </div>

  <div class="sect"><h3>Свободные авто</h3><span class="pill">12 ₽/мин · пауза 3 ₽/мин</span></div>
  <div id="cars" class="grid"></div>

  <div class="sect"><h3>История поездок</h3></div>
  <div class="card" style="padding:6px 16px"><div id="hist"></div></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const H = () => ({ 'Content-Type': 'application/json' });
const RU = { free:'Свободна', hold:'Бронь', rent:'Аренда', service:'Сервис', active:'Поездка', paused:'Пауза', finished:'Завершена', cancelled:'Отменена' };
const ru = s => RU[s] || s;
const map = L.map('map').setView([61.2500, 73.3960], 15);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
L.circle([61.2500, 73.3960], { radius: 900, color: '#22c55e' }).addTo(map).bindPopup('Зона: Сургут');
let markers = [];
async function api(p, o = {}) {
  const r = await fetch(p, { ...o, headers: H() });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || 'ошибка');
  return j;
}
async function login() {
  try {
    const j = await api('/api/login', { method: 'POST', body: JSON.stringify({ phone: phone.value, password: pass.value }) });
    refresh();
  } catch (e) { alert(e.message); }
}
async function register() {
  try {
    const j = await api('/api/register', { method: 'POST', body: JSON.stringify({ phone: phone.value, name: 'Гость', password: pass.value }) });
    refresh();
  } catch (e) { alert(e.message); }
}
async function topup() { await api('/api/topup', { method: 'POST', body: JSON.stringify({ amount: 500 }) }); refresh(); }
async function logout() { try { await api('/api/logout', { method: 'POST' }); } catch (e) {} location.reload(); }
async function refresh() {
  try {
    const me = await api('/api/me');
    user.textContent = me.user.phone + (me.user.is_admin ? ' (admin)' : '');
    balance.textContent = me.user.balance;
    const { cars } = await api('/api/cars');
    markers.forEach(m => m.remove()); markers = [];
    carsEl = document.getElementById('cars'); carsEl.innerHTML = '';
    if (!cars.length) carsEl.innerHTML = '<div class="empty">Авто пока нет</div>';
    cars.forEach(c => {
      const m = L.marker([c.lat, c.lng]).addTo(map).bindPopup(`${c.model} · ${c.plate} · ${ru(c.status)}`);
      markers.push(m);
      const d = document.createElement('div'); d.className = 'card car-card';
      d.innerHTML = `<div class="car-top"><div><b>${c.model}</b><br><span class="plate">${c.plate}</span></div>` +
        `<span class="status"><span class="dot ${c.status}"></span>${ru(c.status)}</span></div>` +
        `<div class="fuel"><i style="width:${c.fuel}%"></i></div>` +
        `<div class="meta">Топливо ${c.fuel}% · <span class="tariff">${c.tariff_drive}₽/мин</span>, пауза ${c.tariff_pause}₽/мин</div>`;
      if (c.status === 'free') {
        const b = document.createElement('button'); b.textContent = 'Забронировать · 15 мин бесплатно';
        b.onclick = async () => { try { await api('/api/bookings', { method: 'POST', body: JSON.stringify({ car_id: c.id }) }); refresh(); } catch (e) { alert(e.message); } };
        d.appendChild(b);
      }
      carsEl.appendChild(d);
    });
    const a = await api('/api/my-active');
    const box = document.getElementById('active');
    box.innerHTML = '';
    if (!a.booking) { box.innerHTML = '<div class="empty">Нет активной аренды — выбери авто ниже</div>'; }
    else {
      const b = a.booking;
      box.innerHTML = `<span class="st">${ru(b.status)}</span> <span class="meta">авто #${b.car_id} · драйв ${Math.floor(b.drive_sec / 60)} мин · пауза ${Math.floor(b.pause_sec / 60)} мин</span><br>` +
      `<small>Бронь держится до ${new Date(b.hold_until * 1000).toLocaleTimeString()}</small><br>` +
      `<input id="code" placeholder="Код из авто (подскажет админка)" style="max-width:240px">` +
      `<div><button onclick="act('start')">Старт по коду</button>` +
      `<button class="ghost" onclick="act('pause')">Пауза</button>` +
      `<button class="ghost" onclick="act('resume')">Продолжить</button>` +
      `<button class="danger" onclick="act('finish')">Завершить</button>` +
      `<button class="ghost" onclick="act('cancel')">Отменить</button></div>`;
      box.dataset.id = b.id;
    }
    const h = await api('/api/history');
    hist.innerHTML = h.history.map(x => `<div class="hist-row"><span>#${x.id} · ${x.model} · ${x.plate} · ${ru(x.status)}</span><span class="sum">${x.total_rub}₽</span></div>`).join('') || '<div class="empty">Поездок пока нет</div>';
  } catch (e) { /* не залогинен */ }
}
let carsEl;
async function act(op) {
  const id = document.getElementById('active').dataset.id;
  try {
    if (op === 'start') {
      const code = document.getElementById('code').value;
      await api(`/api/bookings/${id}/start`, { method: 'POST', body: JSON.stringify({ code }) });
    }
    else if (op === 'cancel') await api(`/api/bookings/${id}/cancel`, { method: 'POST' });
    else await api(`/api/bookings/${id}/${op}`, { method: 'POST' });
    refresh();
  } catch (e) { alert(e.message); }
}
setInterval(() => { refresh(); }, 15000);
const THEME_RU = { dark:'Тёмная', light:'Светлая', auto:'Авто' };
function currentTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  if (t !== 'auto') return t;
  const h = new Date().getHours();
  return (h >= 7 && h < 19) ? 'light' : 'dark';
}
function applyTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  document.documentElement.dataset.theme = currentTheme();
  themeBtn.textContent = 'Тема: ' + THEME_RU[t];
}
function cycleTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  localStorage.setItem('minutka-theme', t === 'dark' ? 'light' : t === 'light' ? 'auto' : 'dark');
  applyTheme();
}
applyTheme();
setInterval(applyTheme, 60000);
refresh();
</script>
</body>
</html>
