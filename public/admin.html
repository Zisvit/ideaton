<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Минутка — админка</title>
<style>
:root{--bg:#0c0f14;--panel:#151a23;--panel2:#1b212d;--line:#262e3d;--text:#eef1f6;--muted:#9aa3b2;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#60a5fa;--r:16px}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);margin:0;-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(13,16,22,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:16px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px}
button{background:linear-gradient(180deg,#2bd465,#1da34e);border:0;color:#fff;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;margin:6px 6px 0 0;font-size:13px}
button:hover{filter:brightness(1.08)}
button.ghost{background:var(--panel2);border:1px solid var(--line)}
input{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0f141c;color:var(--text);margin:4px 4px 4px 0;font-size:14px}
input:focus{outline:none;border-color:var(--green)}
a{color:var(--blue);text-decoration:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .v{font-size:24px;font-weight:800}
.stat .l{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.car{display:flex;flex-direction:column;gap:8px}
.car-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:800;letter-spacing:3px;background:#0f141c;border:1px dashed rgba(34,197,94,.5);color:#4ade80;border-radius:10px;padding:6px 14px}
.st{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
.st.free{background:rgba(34,197,94,.15);color:#4ade80}
.st.hold,.st.rent{background:rgba(245,158,11,.15);color:#fbbf24}
.st.service{background:rgba(239,68,68,.15);color:#f87171}
.meta{font-size:12px;color:var(--muted)}
.rowline{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:9px 2px;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}
.rowline .sum{font-weight:800;white-space:nowrap}
.empty{color:var(--muted);font-size:13px}
[data-theme="light"]{--bg:#eef1f6;--panel:#ffffff;--panel2:#e7ecf3;--line:#d5dce7;--text:#141a24;--muted:#5b6572}
[data-theme="light"] header{background:rgba(255,255,255,.92)}
[data-theme="light"] input{background:#fff}
[data-theme="light"] .code{color:#15803d;border-color:rgba(21,128,61,.5)}
.theme-btn{padding:7px 14px;font-size:12px;margin:0}
.head-right{display:flex;gap:10px;align-items:center}
</style>
</head>
<body>
<header><div class="brand">Минутка · Админка<small>Сургут</small></div><div class="head-right"><button class="ghost theme-btn" id="themeBtn" onclick="cycleTheme()">Тема</button><button class="ghost theme-btn" onclick="logout()">Выйти</button><a href="/">← к приложению</a></div></header>
<div class="wrap">
<div class="card"><h3>Вход</h3>Телефон <input id="phone" value="+70000000000"> Пароль <input id="pass" type="password" value="admin123">
<button onclick="login()">Войти как админ</button></div>
<div class="card"><h3>Статистика</h3><div class="stats"><div class="stat"><div class="v" id="stRev">—</div><div class="l">выручка, ₽</div></div><div class="stat"><div class="v" id="stAct">—</div><div class="l">активных аренд</div></div></div><div class="meta" id="stats" style="margin-top:8px"></div></div>
<h3 style="margin:20px 2px 4px">Автопарк <span class="meta">— код это QR/сейф для старта</span></h3><div id="cars" class="grid"></div>
<h3 style="margin:20px 2px 4px">Последние поездки</h3><div class="card" style="padding:6px 16px"><div id="books"></div></div>
</div>
<script>
const H = () => ({ 'Content-Type': 'application/json' });
const RU = { free:'свободна', hold:'бронь', rent:'аренда', service:'сервис', active:'активна', paused:'пауза', finished:'завершена', cancelled:'отменена' };
const ru = s => RU[s] || s;
async function api(p, o = {}) { const r = await fetch(p, { ...o, headers: H() }); const j = await r.json(); if (!r.ok) throw new Error(j.error); return j; }
async function login() {
  await api('/api/login', { method: 'POST', body: JSON.stringify({ phone: phone.value, password: pass.value }) });
  refresh();
}
async function logout() { try { await api('/api/logout', { method: 'POST' }); } catch (e) {} location.reload(); }
async function refresh() {
  try {
    const s = await api('/api/admin/stats');
    stRev.textContent = s.revenue; stAct.textContent = s.active; stats.textContent = '';
    const { cars } = await api('/api/cars');
    document.getElementById('cars').innerHTML = cars.map(c =>
      `<div class="card car"><div class="car-top"><div><b>${c.model}</b><br><span class="meta">${c.plate} · ${c.tariff_drive}/${c.tariff_pause}₽ · топливо ${c.fuel}%</span></div><span class="st ${c.status}">${ru(c.status)}</span></div>` +
      `<div class="car-top"><span class="code">${c.code_current}</span></div>` +
      `<div><button class="ghost" onclick="setStatus(${c.id},'free')">В линию</button>` +
      `<button class="ghost" onclick="setStatus(${c.id},'service')">В сервис</button></div></div>`).join('') || '<div class="empty">Нет авто</div>';
    const b = await api('/api/admin/bookings');
    document.getElementById('books').innerHTML = b.bookings.map(x =>
      `<div class="rowline"><span>#${x.id} · ${x.phone} · ${x.model} · ${ru(x.status)} · драйв ${x.drive_sec}с · пауза ${x.pause_sec}с</span><span class="sum">${x.total_rub}₽</span></div>`).join('') || '<div class="empty">Поездок пока нет</div>';
  } catch (e) { stRev.textContent = '—'; stAct.textContent = '—'; stats.textContent = 'войдите как админ'; }
}
async function setStatus(id, status) { await api(`/api/admin/cars/${id}`, { method: 'POST', body: JSON.stringify({ status }) }); refresh(); }
const THEME_RU = { dark:'Тёмная', light:'Светлая', auto:'Авто' };
function currentTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  if (t !== 'auto') return t;
  const h = new Date().getHours();
  return (h >= 7 && h < 19) ? 'light' : 'dark';
}
function applyTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  document.documentElement.dataset.theme = currentTheme();
  themeBtn.textContent = 'Тема: ' + THEME_RU[t];
}
function cycleTheme() {
  const t = localStorage.getItem('minutka-theme') || 'auto';
  localStorage.setItem('minutka-theme', t === 'dark' ? 'light' : t === 'light' ? 'auto' : 'dark');
  applyTheme();
}
applyTheme();
setInterval(applyTheme, 60000);
refresh();
</script>
</body>
</html>
