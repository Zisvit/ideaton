name: automerge feat → main
on:
  # push-триггер ВРЕМЕННО снят на время чистки веток (вернуть после)
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: automerge-main
  cancel-in-progress: false
jobs:
  merge-to-main:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Merge feat branch into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetch с ретраями: сеть флапает, со stale-refs мержить нельзя
          FETCH_OK=0
          for i in 1 2 3; do
            if git fetch origin; then FETCH_OK=1; break; fi
            echo "::warning::fetch attempt $i failed, retry in 10s"
            sleep 10
          done
          if [ "$FETCH_OK" != "1" ]; then echo "::error::fetch failed 3x, abort"; exit 1; fi
          # сравниваем со СВЕЖИМ origin/main, а не локальным main (петля-стоп + stale-защита)
          if [ -z "$(git diff "origin/main...origin/$BRANCH")" ]; then
            echo "nothing new in $BRANCH, skip"
            exit 0
          fi
          git checkout -B main origin/main
          if git merge --no-ff "origin/$BRANCH" -m "auto-merge $BRANCH"; then
            git push origin main
          else
            echo "::warning::auto-merge conflict, opening PR instead"
            git merge --abort || true
            if gh pr view "$BRANCH" --json number -q .number >/dev/null 2>&1; then
              echo "PR already exists, skip create"
            else
              gh pr create --base main --head "$BRANCH" \
                --title "auto-merge $BRANCH (конфликт — нужен разбор)" \
                --body "Бот не смог сам слить \`$BRANCH\` в \`main\`. Разрулите конфликт и смержите PR." \
              || echo "::error::failed to create PR"
            fi
            exit 1
          fi
